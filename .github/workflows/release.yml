name: Release

# Deployment is handled by Cloudflare Pages' Git integration on every push to
# `main`. This workflow only reacts to version tags: it bumps package.json to
# match the tag and publishes a GitHub Release.

'on':
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Get version from tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Update package.json version
        run: |
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('./package.json', 'utf8'));
          pkg.version = '${{ steps.tag.outputs.version }}';
          fs.writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "bump version to ${{ steps.tag.outputs.version }}"
          git push

      - name: Create Release
        uses: ncipollo/release-action@v1.13.0
        with:
          commit: ${{ github.sha }}
          tag: '${{ steps.tag.outputs.version }}'
          generateReleaseNotes: true
